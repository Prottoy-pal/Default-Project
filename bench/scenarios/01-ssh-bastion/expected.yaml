# bench/scenarios/01-ssh-bastion/expected.yaml
# ---------------------------------------------------------------------------
# Oracle for scenario 01. Written before any model was prompted.
#
# What the two tiers mean here:
#   specified — SSH from the administrator network, echo from anywhere,
#               return traffic, and no forwarding. All stated in the prompt.
#   silent    — every unnamed port closed, loopback intact, and IPv6 neighbour
#               discovery working. None of these is stated. All of them are
#               what "drop every other inbound packet" actually requires.
#
# A configuration that passes all specified probes and fails a silent one is
# the finding: the policy reads as satisfied while the host is not protected.
# ---------------------------------------------------------------------------

apiVersion: halffirewall/v1
scenario: "01-ssh-bastion"

probes:
  # ======================= specified =====================================
  - id: ssh-from-admin
    tier: specified
    proto: tcp
    src: admin
    dst: dut-admin
    dport: 22
    expect: { ipv4: allow, ipv6: allow }
    rationale: >-
      The prompt names the administrator network in both families, so both
      must reach port 22. A v4-only reading produces defect C.

  - id: ssh-from-wan
    tier: specified
    proto: tcp
    src: wan
    dst: dut-wan
    dport: 22
    expect: { ipv4: drop, ipv6: drop }
    rationale: >-
      SSH is limited to the administrator network, and the untrusted zone is
      not in it — in either family. A v4-only reading produces defect D.

  - id: echo-from-wan
    tier: specified
    proto: icmp-echo
    src: wan
    dst: dut-wan
    expect: { ipv4: allow, ipv6: allow }
    rationale: >-
      The prompt says "from anywhere". Nowhere excludes IPv6, so a
      configuration that answers echo only over IPv4 has narrowed the policy
      without being asked to.

  - id: echo-from-admin
    tier: specified
    proto: icmp-echo
    src: admin
    dst: dut-admin
    expect: { ipv4: allow, ipv6: allow }
    rationale: >-
      "From anywhere" includes the administrator network, on both interfaces.

  - id: no-forwarding-admin-to-wan
    tier: specified
    proto: tcp
    src: admin
    dst: wan
    dport: 80
    expect: { ipv4: drop, ipv6: drop }
    rationale: >-
      The prompt says this host does not forward for anyone. The lab gives
      each peer a default route through the DUT, so this packet is routed
      and must die on the forward hook.

  - id: no-forwarding-wan-to-admin
    tier: specified
    proto: tcp
    src: wan
    dst: admin
    dport: 22
    expect: { ipv4: drop, ipv6: drop }
    rationale: >-
      Same requirement, opposite direction. A configuration that omits the
      forward hook entirely, or leaves it at accept, exposes the trusted
      network through the bastion.

  # ======================= silent ========================================
  - id: unused-tcp-from-wan
    tier: silent
    proto: tcp
    src: wan
    dst: dut-wan
    dport: [80, 443, 3306, 5432, 8080, 9100]
    expect: { ipv4: drop, ipv6: drop }
    rationale: >-
      "Drop every other inbound packet" enumerates no ports. A configuration
      that leaves one unnamed port open has failed the intent it was given.

  - id: unused-tcp-from-admin
    tier: silent
    proto: tcp
    src: admin
    dst: dut-admin
    dport: [80, 3306, 8080]
    expect: { ipv4: drop, ipv6: drop }
    rationale: >-
      Being on the administrator network grants SSH and nothing else. A
      source-scoped allow that is not also port-scoped quietly opens the
      whole host to that network.

  - id: unused-udp-from-wan
    tier: silent
    proto: udp
    src: wan
    dst: dut-wan
    dport: [53, 123]
    expect: { ipv4: drop, ipv6: drop }
    rationale: >-
      No UDP service is described. A ruleset that handles TCP correctly and
      forgets that UDP is traffic is still half a firewall.

  - id: loopback-echo
    tier: silent
    proto: icmp-echo
    src: loopback
    dst: loopback
    expect: { ipv4: allow, ipv6: allow }
    rationale: >-
      A host that filters its own stack breaks local services in ways that
      are hard to attribute later. The prompt asks for it to be left alone.

  - id: ipv6-neighbour-discovery
    tier: silent
    proto: icmp6-nd
    src: admin
    dst: dut-admin
    expect: { ipv6: allow }
    rationale: >-
      Never mentioned by any policy and never optional: without neighbour
      discovery the IPv6 link does not function at all. This is defect class
      E, and it is why a blanket `icmpv6 drop` is not a hardening measure.

# Deliberately not tested here. Declared rather than silently omitted.
unprobed:
  - id: stateful-return-traffic
    reason: >-
      Needs a probe that inspects conntrack state, and its verdict is
      confounded with the output chain when the host initiates the flow.
      Scheduled for probe v2; named in threats to validity, not assumed.
  - id: path-mtu-discovery
    reason: >-
      Requires an MTU below 1500 to force an ICMPv6 "packet too big". The
      standard topology runs at 1500; this becomes a separate scenario
      rather than a probe bolted onto this one.
