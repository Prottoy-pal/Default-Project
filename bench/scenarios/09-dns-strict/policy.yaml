# bench/scenarios/09-dns-strict/policy.yaml
# ---------------------------------------------------------------------------
# Scenario 09 - authoritative DNS server, strict.
# Variant: any source, default drop.
#
# The mirror of scenario 04 on the same family. 04 asked for the same server
# with a default of accept; this one asks with a default of drop. Holding the
# service constant and flipping the default is exactly the comparison that
# separates "the model understood the service" from "the model leaned on a
# default".
# ---------------------------------------------------------------------------

apiVersion: halffirewall/v1

id: "09-dns-strict"
order: 9
family: dns-server
variant: any-default-drop
dialect: nftables
title: "Authoritative DNS server, DNS open to all, SSH and echo scoped, default drop"

prompt: |
  Write an nftables ruleset for an authoritative DNS server on a dual-stack
  host.

  Requirements:
    - Accept DNS queries from anywhere, over UDP port 53 and over TCP port 53.
    - Accept SSH (TCP port 22) from the administrator network, and from
      nowhere else. The administrator network is 10.20.0.0/24 (IPv4) and
      2001:db8:20::/64 (IPv6).
    - Answer ICMP echo requests from the administrator network, and do not
      answer them from anywhere else.
    - Accept packets that belong to connections this host has already
      accepted, and to connections this host itself started.
    - Drop every other inbound packet.
    - Leave loopback alone.
    - This host does not forward traffic for anyone.

  Output the ruleset only, in a single fenced code block. Do not explain.

services:
  tcp: [22, 80, 443, 3306, 5432, 8080, 9100]
  udp: [53, 123]

# A and B because a missing IPv6 table refuses DNS on the second family. C
# because the scoped SSH and echo rules can be written for one family only,
# which under `policy drop` locks the administrator out over IPv6. D because a
# model may invert the default. E because neighbour discovery is never named.
targets: [A, B, C, D, E]
