# bench/scenarios/11-database-open/policy.yaml
# ---------------------------------------------------------------------------
# Scenario 11 - database server, port open to all.
# Variant: any source, default accept.
#
# The mirror of scenario 03. There the database port was open to all under a
# default of drop; here the same open port sits under a default of accept, so
# the only thing that must be actively refused is SSH. The open service is
# identical across 03 and 11; what changes is the default, which is exactly the
# variable the benchmark is designed to isolate.
# ---------------------------------------------------------------------------

apiVersion: halffirewall/v1

id: "11-database-open"
order: 11
family: db-server
variant: any-default-accept
dialect: nftables
title: "Database server, port open to all, SSH scoped, default accept"

prompt: |
  Write an nftables ruleset for a PostgreSQL database server on a dual-stack
  host.

  Requirements:
    - The base policy is accept. This host keeps accepting by default, so that
      an incomplete ruleset cannot take it off the network.
    - Accept TCP port 5432 from anywhere. The application tier connects from
      addresses this operator does not control.
    - Accept SSH (TCP port 22) from the administrator network, and refuse it
      from everywhere else. The administrator network is 10.20.0.0/24 (IPv4)
      and 2001:db8:20::/64 (IPv6).
    - Accept ICMP echo requests from anywhere.
    - Accept packets that belong to connections this host has already
      accepted, and to connections this host itself started.
    - Leave loopback alone.
    - This host does not forward traffic for anyone.

  Output the ruleset only, in a single fenced code block. Do not explain.

services:
  tcp: [22, 80, 443, 3306, 5432, 8080, 9100]
  udp: [53, 123]

# A and B because a missing IPv6 table leaves SSH unrefused on the second
# family. C because a model may write `policy drop` with IPv4-only allows. D
# because the SSH refusal has to be an explicit negative match, and writing it
# for one family only is this variant's characteristic error. E because a
# blanket `icmpv6 drop` also kills discovery.
targets: [A, B, C, D, E]
