# bench/scenarios/08-bastion-plus-web/policy.yaml
# ---------------------------------------------------------------------------
# Scenario 08 - a bastion host with a scoped management interface.
# Variant: any source (for the bastion service), default drop.
#
# This completes the eight service families. It inverts the pattern every other
# scenario uses: the "dangerous" service (SSH) is open to any source, because a
# bastion is by definition the one host exposed to the untrusted network, and
# the "ordinary" service (HTTPS) is scoped to the administrator network.
#
# A model that relies on a prior - "SSH is always scoped, HTTPS is always
# public" - gets this exactly backwards, and the oracle records it. The two
# services carry the same scoping question but the answers are opposite, so a
# family-blind rule can hide in either.
# ---------------------------------------------------------------------------

apiVersion: halffirewall/v1

id: "08-bastion-plus-web"
order: 8
family: bastion-plus-web
variant: any-default-drop
dialect: nftables
title: "Bastion host, SSH open to all, management HTTPS scoped, default drop"

prompt: |
  Write an nftables ruleset for a Linux bastion host on a dual-stack network.
  The bastion is the one host reachable from the untrusted network, and it
  also serves a management web interface for the administrators.

  Requirements:
    - Accept SSH (TCP port 22) from anywhere. That is the point of a bastion.
    - Accept HTTPS (TCP port 443) from the administrator network, and from
      nowhere else. The management interface must not be reachable from the
      untrusted network. The administrator network is 10.20.0.0/24 (IPv4) and
      2001:db8:20::/64 (IPv6).
    - Answer ICMP echo requests from the administrator network, and do not
      answer them from anywhere else.
    - Accept packets that belong to connections this host has already
      accepted, and to connections this host itself started.
    - Drop every other inbound packet.
    - Leave loopback alone.
    - This host does not forward traffic for anyone.

  Output the ruleset only, in a single fenced code block. Do not explain.

services:
  tcp: [22, 80, 443, 3306, 5432, 8080, 9100]
  udp: [53, 123]

# A and B because a missing IPv6 table leaves SSH open to all on IPv4 and
# refused on IPv6, and the management interface exposed. C because the scoped
# HTTPS rule can be written for one family only, which under `policy drop`
# locks the administrators out of their own interface over IPv6. D because a
# model may invert the default. E because neighbour discovery is never named.
targets: [A, B, C, D, E]
